name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm install rather than npm ci: the wallet kit's optional
        # platform-specific native deps (e.g. bufferutil) resolve
        # differently between the lockfile's generating platform and the
        # Linux runner, which trips npm ci's strict lockfile-sync check.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  contract:
    name: Contract — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Pinned rather than "stable": a floating stable channel broke the
        # ethnum crate (a soroban-sdk transitive dep) with an
        # "cannot transmute between types of different sizes" error on a
        # newer compiler. Verified working locally at this exact version.
        uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract

      - name: Run contract tests
        run: cargo test --workspace
